
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Receipt</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main class="receipt">
    <header class="receipt__header">
      <div class="receipt__icon">🛒</div>
      <h1>Shopping Receipt</h1>
      <p>Add products and calculate your shopping total</p>
    </header>

    <section class="product-form">
      <label for="product-name">Product name</label>
      <input
        type="text"
        id="product-name"
        placeholder="e.g. Milk"
      >
      <small class="error-message" id="name-error"></small>

      <div class="product-form__row">
        <div class="field">
          <label for="product-price">Price (£)</label>
          <input
            type="number"
            id="product-price"
            min="0"
            step="0.01"
            placeholder="e.g. 1.50"
          >
          <small class="error-message" id="price-error"></small>
        </div>

        <div class="field">
          <label for="product-quantity">Quantity</label>
          <input
            type="number"
            id="product-quantity"
            min="1"
            step="1"
            value="1"
          >
          <small class="error-message" id="quantity-error"></small>
        </div>
      </div>

      <button class="add-btn" type="button">
        + Add Item
      </button>
    </section>

    <section class="receipt__items">
      <h2>Your Receipt</h2>

      <div class="items-list">
        <!-- JavaScript will add products here -->
      </div>

      <p class="empty-message">No items added yet.</p>
    </section>

    <footer class="receipt__footer">
      <div class="receipt__total">
        <span>Total</span>
        <strong class="total-value">£0.00</strong>
      </div>

      <button class="clear-btn" type="button">
        Clear Receipt
      </button>
    </footer>
  </main>
  <script src="index.js"></script>
</body>
</html>
